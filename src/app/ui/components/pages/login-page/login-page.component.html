<div class="login">
  <h2 class="login__title">Hogar360 - Servicio de autenticación</h2>

  <div class="login__card">
    <mol-form
      [fields]="loginFormFields"
      [formGroup]="loginForm"
      submitLabel="Iniciar sesión"
      (formSubmit)="onSubmit()"
    ></mol-form>
  </div>

  <atm-toast
    *ngIf="toastMessage"
    [config]="{ message: toastMessage, type: toastType }"
    (closed)="onToastClosed()"
  >
  </atm-toast>
</div>
