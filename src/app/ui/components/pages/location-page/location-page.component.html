<div class="location">
  <h1 class="location__title">Crear Ubicación</h1>

  <div class="location__form">
    <mol-form
      [fields]="locationFormFields"
      [formGroup]="locationForm"
      submitLabel="Crear"
      (formSubmit)="onFormSubmit(locationForm.value)"
    ></mol-form>
  </div>

  <atm-toast
    *ngIf="toastMessage"
    [config]="{ message: toastMessage, type: toastType }"
    (closed)="onToastClosed()"
  >
  </atm-toast>
</div>
