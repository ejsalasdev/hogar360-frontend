<div class="location">
  <h2 class="location__title">Crear Ubicación</h2>

  <div class="location__card">
    <mol-form
      [fields]="locationFormFields"
      [formGroup]="locationForm"
      submitLabel="Crear"
      (formSubmit)="onFormSubmit(locationForm.value)"
    ></mol-form>
  </div>

  <atm-toast
    *ngIf="toastMessage"
    [config]="{ message: toastMessage, type: toastType }"
    (closed)="onToastClosed()"
  >
  </atm-toast>

  <h2 class="location__title">Ubicaciones existentes</h2>
  <div class="location__card">
    <org-table
      [columns]="locationTableColumns"
      [data]="locations"
      [pagination]="pageInfo"
      [loading]="isLoading"
      (pageChange)="onPageChange($event)"
      [sort]="sort"
      (sortChange)="onSortChange($event)"
      class="location__table"
    ></org-table>
  </div>
</div>
