<div class="location">
  <h1 class="location__title">Crear Ubicación</h1>

  <form
    #createLocationForm="ngForm"
    (ngSubmit)="onSubmit()"
    class="location__form"
  >
    <div class="location__form-group">
      <atm-select
        #departmentSelectRef
        label="Departamento"
        [options]="departments"
        [required]="true"
        [(ngModel)]="selectedDepartmentId"
        name="department"
        placeholder="Seleccione un departamento"
        (valueChange)="onDepartmentChange($any($event))"
      >
      </atm-select>
    </div>

    <div class="location__form-group">
      <atm-select
        #citySelectRef
        label="Ciudad"
        [options]="cities"
        [required]="true"
        [(ngModel)]="selectedCityId"
        name="city"
        placeholder="Seleccione una ciudad"
        [isDisabled]="!selectedDepartmentId"
      >
      </atm-select>
    </div>

    <div class="location__form-group">
      <atm-form-input
        #sectorInputRef
        label="Sector"
        [maxlength]="maxLengthSector"
        [required]="true"
        [(ngModel)]="sector"
        name="sector"
      >
      </atm-form-input>
    </div>

    <div class="location__button-container">
      <button
        type="submit"
        class="location__button"
        [disabled]="!createLocationForm.valid || !selectedDepartmentId || !selectedCityId || !sector"
      >
        Crear
      </button>
    </div>
  </form>

  <atm-toast
    *ngIf="toastMessage"
    [config]="{ message: toastMessage, type: toastType }"
    (closed)="onToastClosed()"
  >
  </atm-toast>
</div>
