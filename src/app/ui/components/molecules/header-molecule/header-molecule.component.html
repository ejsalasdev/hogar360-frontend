<div class="header">
  <div class="logo">
    <span class="logo__blue">Hogar</span> 360
  </div>
  <div class="user-info">
    <span class="welcome">{{ welcomeMessage }}, {{ userName }}</span>
    <div class="avatar" *ngIf="userAvatarUrl">
      <img [src]="userAvatarUrl" alt="Avatar" />
    </div>
    <div class="avatar" *ngIf="!userAvatarUrl">
      <i class="fa fa-user-circle"></i>
    </div>
  </div>
</div>
