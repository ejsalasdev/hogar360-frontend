<div class="confirm-dialog" *ngIf="show">
  <div class="confirm-dialog__overlay" (click)="onCancel()"></div>
  <div class="confirm-dialog__content">
    <h3 class="confirm-dialog__title">{{ title }}</h3>
    <p class="confirm-dialog__message">{{ message }}</p>
    <div class="confirm-dialog__buttons">
      <button class="confirm-dialog__button confirm-dialog__button--cancel" (click)="onCancel()">
        Cancelar
      </button>
      <button class="confirm-dialog__button confirm-dialog__button--confirm" (click)="onConfirm()">
        Confirmar
      </button>
    </div>
  </div>
</div>
